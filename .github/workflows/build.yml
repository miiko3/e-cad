name: Сборка e-cad

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Установить зависимости
        run: python -m pip install --upgrade pip; python -m pip install PySide6 numpy pyinstaller

      - name: Проверка импорта и ядра
        run: |
          python -c "import sys; sys.path.insert(0,'.'); from ecad.core import geom, model, fill, drc, exporters, importers, tools_lib, footprints; from ecad.ui import theme, canvas, panels, dialogs, dialogs_board, render, helpwindow, about, main_window; print('ecad modules ok')"

      - name: Сборка исполняемого файла
        run: |
          pyinstaller --noconfirm --clean --windowed --onefile --name e-cad `
            --add-data "assets;assets" --add-data "examples;examples" `
            --exclude-module scipy --exclude-module pandas --exclude-module matplotlib `
            main.py
          if (-not (Test-Path "dist\e-cad.exe")) { throw "dist\e-cad.exe не найден" }

      - name: Архив сборки
        uses: actions/upload-artifact@v4
        with:
          name: e-cad-windows
          path: dist/e-cad.exe
          if-no-files-found: error
          retention-days: 90

      - name: Создать релиз
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" "dist/e-cad.exe" `
            --title "e-cad ${{ github.ref_name }}" `
            --notes "Сборка e-cad для Windows. Запуск: распаковать и запустить e-cad.exe."